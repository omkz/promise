name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync --locked

      - name: Lint (ruff)
        # Non-blocking for now: surfaces pre-existing findings from before ruff
        # was wired up without gating the build on a backlog of style debt.
        run: uv run ruff check packages services tests
        continue-on-error: true

      - name: pytest
        run: uv run pytest tests/ -v
