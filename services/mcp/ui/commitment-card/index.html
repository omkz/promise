<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PROMISE — Commitment Card</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: transparent;
    color: #101114;
  }
  .card {
    border: 1px solid #e5e7ee;
    border-radius: 18px;
    padding: 16px 18px;
    background: #ffffff;
  }
  .brand { font-weight: 900; letter-spacing: .14em; font-size: 12px; color: #101114; }
  .headline { font-weight: 800; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6f7480; margin: 10px 0 4px; }
  .title { font-size: 18px; font-weight: 800; margin: 0 0 10px; line-height: 1.3; }
  .rows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .row .k { color: #6f7480; }
  .row .v { font-weight: 700; text-align: right; }
  .quote {
    background: #f6f7fb; border-radius: 12px; padding: 10px 12px; font-size: 12.5px;
    color: #33363f; line-height: 1.45; margin: 6px 0 14px; font-style: italic;
  }
  .source-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6f7480; margin-bottom: 4px; }
  button {
    width: 100%; border: 0; background: #111318; color: #fff; font-weight: 800;
    padding: 14px; border-radius: 12px; font-size: 14px; cursor: pointer;
    min-height: 44px; touch-action: manipulation;
  }
  button:disabled { opacity: .55; cursor: default; }
  .status { margin-top: 10px; font-size: 12px; color: #6f7480; min-height: 14px; }
  .status.ok { color: #1e8a5a; }
  .status.err { color: #c53b3b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) body { color: #f2f3f6; }
    :root:not([data-theme="light"]) .card { background: #17181c; border-color: #2a2c33; }
    :root:not([data-theme="light"]) .brand,
    :root:not([data-theme="light"]) .title { color: #f2f3f6; }
    :root:not([data-theme="light"]) .quote { background: #202127; color: #cdd0d8; }
  }
  [data-theme="dark"] body,
  [data-theme="dark"] .brand,
  [data-theme="dark"] .title { color: #f2f3f6; }
  [data-theme="dark"] .card { background: #17181c; border-color: #2a2c33; }
  [data-theme="dark"] .quote { background: #202127; color: #cdd0d8; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">PROMISE</div>
    <div class="headline">Commitment captured</div>
    <p class="title" id="title">—</p>
    <div class="rows">
      <div class="row"><span class="k">Contact</span><span class="v" id="contact">—</span></div>
      <div class="row"><span class="k">Due</span><span class="v" id="due">—</span></div>
    </div>
    <div class="source-label">Source</div>
    <div class="quote" id="excerpt">—</div>
    <button id="handle" disabled>Handle this</button>
    <div class="status" id="status"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
