[project]
name = "promise-domain"
version = "0.1.0"
description = "PROMISE domain layer: entities, statuses, repositories"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "promise-shared"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promise_domain*"]

[tool.uv.sources]
promise-shared = { workspace = true }
