[project]
name = "promise-shared"
version = "0.1.0"
description = "PROMISE shared kernel: ids, time, errors, storage adapters"
requires-python = ">=3.10"
dependencies = ["boto3>=1.40,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promise_shared*"]
