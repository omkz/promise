[project]
name = "promise-auth"
version = "0.1.0"
description = "PROMISE identity & authorization: AuthProvider abstraction, JWT/JWKS validation, principal resolution"
requires-python = ">=3.10"
dependencies = ["promise-shared", "PyJWT[crypto]>=2.10,<3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promise_auth*"]

[tool.uv.sources]
promise-shared = { workspace = true }
