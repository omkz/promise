[project]
name = "promise-integrations"
version = "0.1.0"
description = "PROMISE integration provider abstraction + local/demo provider + Gmail (OAuth, search/send)"
requires-python = ">=3.10"
dependencies = ["promise-domain", "promise-shared", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promise_integrations*"]

[tool.uv.sources]
promise-domain = { workspace = true }
promise-shared = { workspace = true }
